<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5a4c"/><stop offset="1" stop-color="#f0b46a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe6dc"/><stop offset="1" stop-color="#7fb3a0"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f1ea"/><stop offset="1" stop-color="#d9d3c6"/>
    </linearGradient>
  </defs>
  <rect width="520" height="400" rx="24" fill="url(#sky)"/>
  <circle cx="420" cy="300" r="46" fill="#ffd89a" opacity=".8"/>
  <!-- back towers -->
  <rect x="20" y="170" width="70" height="230" fill="#1f4a3e" opacity=".55"/>
  <rect x="430" y="150" width="80" height="250" fill="#1f4a3e" opacity=".55"/>
  <!-- main tower -->
  <rect x="150" y="40" width="220" height="360" fill="url(#tower)"/>
  <rect x="150" y="40" width="220" height="16" fill="#0f2c24"/>
  <g fill="url(#glass)">
    <rect x="168" y="72" width="56" height="34" rx="3"/><rect x="232" y="72" width="56" height="34" rx="3"/><rect x="296" y="72" width="56" height="34" rx="3"/>
    <rect x="168" y="120" width="56" height="34" rx="3"/><rect x="232" y="120" width="56" height="34" rx="3"/><rect x="296" y="120" width="56" height="34" rx="3"/>
    <rect x="168" y="168" width="56" height="34" rx="3"/><rect x="232" y="168" width="56" height="34" rx="3"/><rect x="296" y="168" width="56" height="34" rx="3"/>
    <rect x="168" y="216" width="56" height="34" rx="3"/><rect x="232" y="216" width="56" height="34" rx="3"/><rect x="296" y="216" width="56" height="34" rx="3"/>
    <rect x="168" y="264" width="56" height="34" rx="3"/><rect x="232" y="264" width="56" height="34" rx="3"/><rect x="296" y="264" width="56" height="34" rx="3"/>
  </g>
  <g fill="#ffd89a" opacity=".9">
    <rect x="232" y="120" width="56" height="34" rx="3"/><rect x="168" y="216" width="56" height="34" rx="3"/><rect x="296" y="264" width="56" height="34" rx="3"/>
  </g>
  <g stroke="#0f2c24" stroke-width="3">
    <line x1="160" y1="108" x2="360" y2="108"/><line x1="160" y1="156" x2="360" y2="156"/><line x1="160" y1="204" x2="360" y2="204"/>
    <line x1="160" y1="252" x2="360" y2="252"/><line x1="160" y1="300" x2="360" y2="300"/>
