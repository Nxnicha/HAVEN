  <!-- lobby -->
  <rect x="150" y="318" width="220" height="82" fill="#0f2c24"/>
  <rect x="226" y="340" width="68" height="60" fill="#ffd89a" opacity=".85"/>
  <text x="260" y="333" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" font-weight="700" fill="#f4f1ea" letter-spacing="4">HAVEN</text>
  <!-- trees -->
  <g fill="#2f7d65">
    <circle cx="120" cy="372" r="26"/><circle cx="100" cy="384" r="20"/>
    <circle cx="402" cy="374" r="24"/><circle cx="424" cy="386" r="18"/>
